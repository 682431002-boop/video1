<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Size and Spacing</title>
        <style>
            div {
                background-color: orange;
                width: 200px;
                height: 200px;
                padding: 20px;  /* ระยะห่างภายในขอบ */
                margin: 20px;   /* ระยะห่างภายนอกขอบ */
            }
        </style>
    </head>
    <body>
        <div>
            Hello, world!
        </div>
    </body>
</html>
