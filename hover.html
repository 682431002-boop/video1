<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hover</title>
        <style>
            button {
                width: 200px;
                height: 50px;
                background-color: rgb(164, 197, 223);
                font-size: 24px;
            }

            button:hover {
                background-color: rgb(225, 214, 214);
            }
        </style>
    </head>
    <body>
        <button>Click Me!</button>
    </body>
</html>
