<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Font and Border</title>
        <style>
            div {
                border: 3px solid black;
                font-family: Arial, sans-serif;
                font-size: 28px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div>
            Hello, world!
        </div>
        Some more text outside the div.
    </body>
</html>
