<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Flexbox</title>
        <style>
            #container {
                display: flex;
                flex-wrap: wrap;
            }

            #container > div {
                background-color: rgb(250, 200, 113);
                font-size: 20px;
                margin: 20px;
                padding: 20px;
                width: 200px;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div>1. Some text inside a div</div>
            <div>2. Some text inside a div</div>
            <div>3. Some text inside a div</div>
            <div>4. Some text inside a div</div>
        </div>
    </body>
</html>
